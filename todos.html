      font-family: 'Segoe UI', sans-serif;
      /*padding: 0 30px;*/
      background-color: rgb(83, 80, 80);
      margin: 0;
    }

    .manage-container-left-side h3 {
      color: whitesmoke;
    }

    /* Manage Task Upper row input Style */
    .todo-inputs {
      display: flex;
      flex-wrap: wrap;
      flex: 0 1 auto;
      min-width: 0;
      gap: 10px;
      margin-bottom: 15px;
      background: rgb(36, 132, 164);
    }

    /* Inputs / List / Reminder text/button/dropdown Style */
    .todo-inputs input,
    .todo-inputs select,
    .todo-inputs button,
    .prompt_content button,
    .todo-controls input,
    .todo-controls select,
    li button,
    .popup-content button {
      padding: 5px;
      font-size: 12px;
      border-radius: 5px;
      border: 1px solid rgb(133, 211, 236);
    }

    label {
      font-weight: 500;
    }

    /* Add / List / Reminder button Style */
    .todo-inputs button,
    li button,
    .popup-content button {
      background-color: rgb(133, 211, 236);
      color: rgb(44, 130, 159);
      font-weight: bold;
      /*border: none;*/
      cursor: pointer;
      transition: background-color 0.3s;
    }

    /* List button Style */
    li button {
      background: rgb(44, 130, 159);
      color: rgb(133, 211, 236);
      font-weight: bold;
    }

    li #btnEdit {
      margin-right: 10px;
    }

    /* Add / Reminder / List button Animation Style */
    .todo-inputs button:hover,
    .prompt_content button:hover,
    li button:hover,
    .popup-content button:hover {
      color: rgb(133, 211, 236);
      background-color: rgb(34, 100, 123);
    }

    /* Manage Task lower row input Style */
    .todo-controls {
      display: flex;
      flex-wrap: wrap;
      min-width: 0;
      gap: 10px;
      flex: 0 1 auto;
      margin-bottom: 15px;
    }

    /* List Style */
    #todo-list {
      list-style-type: none;
      padding: 0 5px;
      margin: 2px;
    }

    #todo-list li {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      /* Forcing long words to break */
      background: rgb(133, 211, 236);
      margin: 6px 0;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    li.completed span.todo-text {
      text-decoration: line-through;
      color: gray;
    }

    li span.todo-text {
      flex: 1;
      /*flex-grow: 1; - puts items on different lines when wrapped and in contrast flex:1 keeps in same line all items when wrapped*/
    }

    .meta {
      font-size: 0.8em;
      color: rgb(34, 100, 123);
      margin-right: 10px;
    }

    .priority-high {
      color: red;
    }

    .priority-medium {
      color: orange;
    }

    .priority-low {
      color: green;
    }

    .overdue {
      color: red;
      font-weight: bold;
      font-size: 1.1em;
    }

    /* List Animation Style */
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Task Manage Container Style */
    .todo-list-manage-container {
      display: flex;
      justify-content: space-between;
      /*align-items: flex-start;*/
      gap: 10px;
      background-color: rgb(44, 130, 159);
      padding: 10px;
      margin: 5px 30px 0;
      border-radius: 20px;
      position: sticky;
      top: 0;
      /*For avoiding animation flickering bublled from todo list*/
      /*background-color: white; - background needed if element is tranparent*/
      z-index: 10;
      transform: translateZ(0);
      isolation: isolate;
      contain: paint;
      overflow: visible;
    }

    /* Task Manage Right side Container Style */
    .manage-container-right-side {
      display: flex;
      flex: 0 1 50%;
      min-width: 0;
      justify-content: center;
      align-items: center;
      /*border-radius: ;*/
      /*padding-right: 40px;*/
    }

    /* Task Manage Left side Container Style */
    .manage-container-left-side {
      display: flex;
      flex-direction: column;
      flex: 0 1 50%;
      flex-wrap: wrap;
      min-width: 0;
      justify-content: center;
    }

    /* Card style */
    .cardContainer {
      /*float: left;*/

      background-color: pink;
      border: 1px solid black;
      /*box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);*/

      text-align: center;
    }

      font-size: 12px;
    }

    .cardFooter {
      background-color: whitesmoke;
      border: solid whitesmoke;
      font-size: 10px;
    }

    .card_rotate_right {
      transform: rotate(7deg);
      background-color: pink;
    }

    .card_rotate_left {
      transform: rotate(-8deg);
      background-color: lightblue;
    }

    /* Todo List Container Style */
    .todo-list-container {
      background-color: rgb(44, 130, 159);
      padding: 5px;
      margin: 5px 40px 60px;
      border-radius: 20px;
    }

    /* Parent Container Style */
    .parent-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      /*Pushes footer at bottom - Here not needed as footer is fixed */
    }

    /* Main Container Style  */

      flex: 1;

      left: 0;
      width: 100%;
      height: 100%;

      align-items: center;
